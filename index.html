<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1918">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="The crab goes birdwatching: a new bird, field note and real recording every 12 hours.">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>birdcrab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comic+Neue:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* layout: weathercrab's phone-width column — header, the crab birdwatching on a soft glow, the bird's name and field note,
   a countdown to the next bird, one pill button. single dark theme on purpose: a night-time marker sketch. */
:root {
  color-scheme: dark;
  --bg: #1b1918;
  --ink: #efe9e1;
  --muted: #a8a097;
  --faint: #6f6861;
  --chip: #2c2927;
  --chip-hover: #37332f;
  --sheet: #232120;
  --line: #3a3633;
  --scrim: rgba(0, 0, 0, .5);
  --focus: #8fb3d9;
  --tip: #9fd08a;
  --glow-o: .5;
  --font: "Comic Neue", "Comic Sans MS", "Chalkboard SE", "Comic Sans", cursive;
}
[hidden] { display: none !important; }
@property --glow { syntax: "<color>"; inherits: true; initial-value: #6fb25d; }

html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 15px;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 10px; }

.app {
  position: relative;
  min-height: 100%;
  max-width: 430px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 14px;
  display: flex;
  flex-direction: column;
  box-sizing: border-box;
}

/* header */
.top { display: grid; grid-template-columns: minmax(32px, 1fr) minmax(0, auto) minmax(max-content, 1fr); align-items: center; gap: 6px; height: 46px; flex: none; }
.top-left { justify-self: start; display: flex; gap: 6px; }
.round {
  width: 32px; height: 32px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--chip); color: var(--muted);
  font-size: 13px; font-weight: 700;
  transition: background-color .2s, color .2s, opacity .2s;
}
.round:hover { background: var(--chip-hover); color: var(--ink); }
.round svg { width: 15px; height: 15px; }
.round[disabled] { opacity: .3; pointer-events: none; }
.install { position: relative; background: #ffffff; }
.install:hover { background: #ffffff; box-shadow: 0 0 0 2px var(--chip-hover); }
.round .app-glyph { width: 28px; height: 24px; }
.install .badge {
  position: absolute; right: -3px; bottom: -3px;
  width: 14px; height: 14px; border-radius: 50%;
  display: grid; place-items: center;
  background: #2b2522; color: #ffffff; box-shadow: 0 0 0 2px var(--bg);
  font-size: 12px; font-weight: 700; line-height: 1;
}
.when {
  justify-self: center;
  display: inline-flex; flex-direction: column; align-items: center;
  font-weight: 700; font-size: 17px; color: var(--muted);
  padding: 4px 8px; border-radius: 12px;
  max-width: 100%; min-width: 0;
}
.when:hover { color: var(--ink); }
.when-line { display: inline-flex; align-items: center; gap: 5px; max-width: 100%; }
.when-line span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.when .chev { width: 11px; height: 11px; flex: none; }
.when .sub { font-size: 12px; font-weight: 400; line-height: 14px; }
.units { justify-self: end; display: flex; gap: 2px; padding: 3px; border-radius: 999px; background: var(--chip); }
.units button { font-size: 12px; font-weight: 700; line-height: 1; color: var(--muted); padding: 6px 8px; border-radius: 999px; transition: background-color .2s, color .2s; }
.units button:hover { color: var(--ink); }
.units button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

/* your weather */
.wx {
  align-self: center; flex: none;
  display: inline-flex; align-items: center; gap: 6px; max-width: 100%; min-width: 0;
  margin-top: 4px; padding: 5px 13px 5px 9px; border-radius: 999px;
  background: var(--chip); color: var(--ink); font-size: 13px;
  transition: background-color .2s;
}
.wx:hover { background: var(--chip-hover); }
.wx svg { width: 17px; height: 17px; flex: none; color: var(--muted); }
.wx b { font-size: 15px; font-variant-numeric: tabular-nums; flex: none; }
.wx span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.wx .dim { color: var(--muted); }
.wx .hl { flex: none; color: var(--muted); font-variant-numeric: tabular-nums; }

/* stage */
.main { position: relative; flex: 1; display: flex; flex-direction: column; justify-content: center; }
.stage { position: relative; flex: 1 1 0; min-height: 170px; max-height: 300px; display: grid; grid-template-columns: minmax(0, 1fr); place-items: center; container-type: size; }
.glow, .fx {
  position: absolute; left: 50%; top: 50%;
  width: min(100cqw, 133cqh); aspect-ratio: 4 / 3;
  translate: -50% -50%;
}
.glow {
  border-radius: 50%;
  background: radial-gradient(closest-side, var(--glow) 0%, var(--glow) 40%, color-mix(in srgb, var(--glow) 0%, transparent) 100%);
  filter: blur(6px);
  opacity: var(--glow-o);
  transition: --glow .8s ease;
}
.fx { pointer-events: none; z-index: 2; }
.scene-stack { position: relative; width: min(100cqw, 130cqh); aspect-ratio: 4 / 3; }
.holder { position: absolute; inset: 0; opacity: 0; transform: translateY(6px) scale(.97); transition: opacity .38s ease, transform .38s ease; }
.holder.on { opacity: 1; transform: none; }
.holder svg { width: 100%; height: 100%; display: block; overflow: visible; }

/* crab idle motion, from weathercrab */
.holder .crab .eyes { transform-box: fill-box; transform-origin: center; animation: blink 5.5s infinite; }
.holder .crab .breathe, .holder .crab .move { transform-box: fill-box; transform-origin: 50% 100%; }
.holder .crab .breathe { animation: breathe 3.4s ease-in-out infinite; }
.holder .crab[data-move="sway"] .move { animation: sway 3.4s ease-in-out infinite alternate; }
.holder .crab[data-move="hop"] .move { animation: hop 1.9s ease-in-out 3; }
.holder .crab .bino { transform-box: fill-box; transform-origin: 50% 50%; animation: peek 6s ease-in-out infinite; }

/* bird motion, by kind */
.holder .bird .beye { transform-box: fill-box; transform-origin: center; animation: blink 4.6s infinite; }
.holder .bird .bmove { transform-box: fill-box; transform-origin: 50% 100%; }
.holder .bird[data-move="bob"] .bmove { animation: bob 2.2s ease-in-out infinite; }
.holder .bird[data-move="float"] .bmove { animation: float 3.2s ease-in-out infinite; }
.holder .bird[data-move="hover"] .bmove { animation: hover 1.4s ease-in-out infinite; }
.holder .bird[data-move="sway"] .bmove { animation: sway 4.2s ease-in-out infinite alternate; }
.holder .bird[data-move="peck"] .bmove { animation: peck 3.6s ease-in-out infinite; }
.holder .bird[data-move="still"] .bmove { animation: breathe 3.8s ease-in-out infinite; }
.holder .bird .blur { transform-box: fill-box; transform-origin: 50% 100%; animation: flutter .09s linear infinite alternate; }
.holder .bird .land { transform-box: fill-box; transform-origin: 50% 100%; animation: land .5s cubic-bezier(.3, 1.5, .5, 1) both; }
.holder .ripple { transform-box: fill-box; transform-origin: center; animation: ripple 3s ease-out infinite; }
.holder .ripple.r2 { animation-delay: -1.5s; }

@keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.12); } }
@keyframes breathe { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(1.02); } }
@keyframes sway { from { transform: rotate(-1.6deg); } to { transform: rotate(1.6deg); } }
@keyframes hop { 0%, 55%, 100% { transform: translateY(0) scale(1, 1); } 8% { transform: translateY(0) scale(1.04, .93); } 22% { transform: translateY(-14px) scale(.97, 1.05); } 36% { transform: translateY(0) scale(1.05, .93); } 46% { transform: none; } }
@keyframes peek { 0%, 70%, 100% { transform: none; } 76%, 90% { transform: translateY(-3px) rotate(-4deg); } }
@keyframes bob { 0%, 60%, 100% { transform: none; } 70% { transform: translateY(-2px) rotate(-2deg); } 80% { transform: none; } 88% { transform: translateY(-1.5px) rotate(1.5deg); } }
@keyframes float { 0%, 100% { transform: translateY(0) rotate(-.6deg); } 50% { transform: translateY(2px) rotate(.6deg); } }
@keyframes hover { 0%, 100% { transform: translate(0, 0); } 30% { transform: translate(-2px, -4px); } 65% { transform: translate(1px, 2px); } }
@keyframes peck { 0%, 62%, 82%, 100% { transform: none; } 68%, 76% { transform: rotate(-9deg); } 72% { transform: rotate(-4deg); } }
@keyframes flutter { from { transform: scaleY(1); } to { transform: scaleY(-.35); } }
@keyframes land { from { transform: translateY(-30px) scale(.8); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes ripple { 0% { transform: scale(.4); opacity: 0; } 20% { opacity: .7; } 100% { transform: scale(1.6); opacity: 0; } }

/* the bird: name, where it lives, how big */
.who { display: grid; grid-template-columns: 32px minmax(0, 1fr) 32px; align-items: center; gap: 8px; flex: none; margin-top: 4px; }
.who-text { text-align: center; min-width: 0; }
.bird-name { font-weight: 700; font-size: 26px; line-height: 31px; text-wrap: balance; }
.sci { font-style: italic; font-size: 13px; line-height: 17px; color: var(--muted); margin-top: 1px; }
.chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 10px; flex: none; }
.chip {
  display: inline-flex; align-items: center; gap: 5px; min-width: 0; max-width: 100%;
  padding: 4px 11px 4px 8px; border-radius: 999px;
  background: var(--chip); color: var(--ink); font-size: 13px; font-weight: 700;
}
.chip svg { width: 13px; height: 13px; flex: none; color: var(--muted); }
.chip span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip .dim { color: var(--muted); font-weight: 400; }

/* the bird's own voice */
.listen { display: flex; justify-content: center; margin-top: 10px; flex: none; min-height: 34px; }
.play {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 7px 16px 7px 8px; border-radius: 999px;
  color: var(--ink); font-size: 14px; font-weight: 700;
  background: linear-gradient(90deg, color-mix(in srgb, var(--glow) 42%, var(--chip)) var(--p, 0%), var(--chip) var(--p, 0%));
  transition: box-shadow .2s;
}
.play:hover { box-shadow: inset 0 0 0 1.5px var(--faint); }
.play .pi { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: var(--bg); flex: none; }
.play .pi svg { width: 10px; height: 10px; }
.play .dim { color: var(--muted); font-weight: 400; font-size: 12px; font-variant-numeric: tabular-nums; }
.play .bars { display: inline-flex; align-items: flex-end; gap: 2px; height: 12px; }
.play .bars i { width: 3px; border-radius: 2px; background: var(--ink); animation: eq .7s ease-in-out infinite alternate; }
.play .bars i:nth-child(2) { animation-delay: -.25s; } .play .bars i:nth-child(3) { animation-delay: -.5s; }
@keyframes eq { from { height: 3px; } to { height: 12px; } }
.quiet { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 999px; background: var(--chip); color: var(--muted); font-size: 13px; }
.quiet svg { width: 14px; height: 14px; }
.credit { margin: 6px auto 0; max-width: 360px; font-size: 11px; line-height: 15px; color: var(--faint); text-wrap: balance; }
.credit a { color: var(--muted); text-underline-offset: 2px; }
.stage.singing .holder .bird .bmove { animation: sing .42s ease-in-out infinite alternate; }
@keyframes sing { from { transform: rotate(-1.6deg); } to { transform: rotate(1.6deg) translateY(-2px); } }

/* the field note */
.fact { margin-top: 12px; flex: none; text-align: center; padding-inline: 6px; }
.fact-label { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; letter-spacing: .08em; color: var(--tip); }
.fact-label svg { width: 13px; height: 13px; }
.fact p { margin: 4px auto 0; max-width: 360px; font-size: 16px; line-height: 22px; min-height: 66px; text-wrap: pretty; }

/* the countdown */
.timer {
  align-self: center; flex: none;
  display: flex; align-items: center; gap: 12px;
  margin-top: 6px; padding: 8px 18px 8px 10px; border-radius: 22px;
  background: var(--chip);
}
.ring { width: 46px; height: 46px; flex: none; }
.ring .track-c { stroke: var(--line); }
.ring .fill-c { stroke: var(--glow); transition: stroke-dashoffset 1s linear, stroke .8s ease; }
.ring .dot { fill: var(--ink); }
.timer-text { display: flex; flex-direction: column; min-width: 0; }
.timer-label { font-size: 12px; line-height: 15px; color: var(--muted); white-space: nowrap; }
.count { font-size: 30px; line-height: 34px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: .01em; }
.count .u { font-size: 15px; color: var(--muted); margin: 0 4px 0 1px; }

.more { align-self: center; margin-top: 12px; white-space: nowrap; flex: none; }
.foot { display: flex; justify-content: center; padding-top: 10px; flex: none; }
.pill {
  background: var(--chip); color: var(--muted);
  font-weight: 700; font-size: 13px;
  padding: 10px 22px; border-radius: 999px;
  transition: background-color .2s, color .2s;
}
.pill:hover { background: var(--chip-hover); color: var(--ink); }
.note { font-size: 11px; line-height: 15px; color: var(--faint); margin: 0; min-height: 15px; text-align: center; text-wrap: balance; }
.note button { color: var(--muted); text-decoration: underline; text-underline-offset: 2px; font-size: 11px; }
.note button:hover { color: var(--ink); }

/* sheets, from weathercrab */
.sheet-wrap { position: fixed; inset: 0; z-index: 10; display: flex; align-items: flex-end; justify-content: center; }
.backdrop { position: absolute; inset: 0; background: var(--scrim); opacity: 0; transition: opacity .25s ease; }
.sheet {
  position: relative;
  width: 100%; max-width: 430px; max-height: 84%;
  box-sizing: border-box;
  background: var(--sheet);
  border-radius: 26px 26px 0 0;
  padding-left: max(18px, env(safe-area-inset-left, 0px));
  padding-right: max(18px, env(safe-area-inset-right, 0px));
  padding-block: 14px calc(18px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 12px;
  transform: translateY(104%);
  transition: transform .32s cubic-bezier(.2, .8, .2, 1);
  box-shadow: 0 -8px 30px rgba(0, 0, 0, .45);
}
.sheet-wrap.open .backdrop { opacity: 1; }
.sheet-wrap.open .sheet { transform: none; }
.grab { width: 38px; height: 4px; border-radius: 4px; background: var(--line); align-self: center; flex: none; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex: none; }
.sheet-head h2 { margin: 0; font-size: 18px; font-weight: 700; min-width: 0; }
.sheet-sub { font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 6px; }
.sheet-note { font-size: 12px; color: var(--muted); margin: 0; text-align: center; flex: none; text-wrap: pretty; }
#logSheet .sheet { height: 84%; }

.life { display: flex; align-items: center; gap: 10px; flex: none; font-size: 13px; color: var(--muted); }
.life b { color: var(--ink); font-variant-numeric: tabular-nums; }
.bar { flex: 1; height: 6px; border-radius: 6px; background: var(--chip); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 6px; background: var(--tip); }
.log { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px 4px; overflow-y: auto; min-height: 0; align-content: start; }
.log-card { min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 6px 4px 9px; border-radius: 14px; text-align: center; }
.log-card:hover, .log-card.sel { background: var(--chip); }
.log-card.sel { box-shadow: inset 0 0 0 1.5px var(--faint); }
.log-card .mini { width: 100%; aspect-ratio: 184 / 202; margin-bottom: 2px; }
.log-card .mini svg { width: 100%; height: 100%; display: block; }
.log-card .lw { font-size: 11px; line-height: 14px; font-weight: 700; color: var(--muted); }
.log-card .lw.now { color: var(--tip); }
.log-card b { font-size: 12.5px; line-height: 15px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.log-card small { font-size: 11px; line-height: 14px; color: var(--faint); }
.log-card small.got { color: var(--tip); }
.log-card.next { cursor: default; border: 1.5px dashed var(--line); }
.log-card.next:hover { background: none; }
.log-card.next .count-s { font-size: 12px; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }

.how { overflow-y: auto; min-height: 0; display: flex; flex-direction: column; gap: 12px; padding-bottom: 4px; }
.how p { margin: 0; font-size: 14px; line-height: 21px; color: var(--muted); text-wrap: pretty; }
.how b { color: var(--ink); }
.how a { color: var(--ink); text-underline-offset: 2px; }

.install-app { display: flex; align-items: center; gap: 14px; padding: 4px 2px; flex: none; }
.install-app .icon { width: 60px; height: 60px; flex: none; border-radius: 14px; background: #ffffff; display: grid; place-items: center; overflow: hidden; }
.install-app .icon svg { width: 86%; height: 86%; }
.install-app b { display: block; font-size: 16px; }
.install-app small { font-size: 13px; color: var(--muted); }
.steps { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; counter-reset: step; }
.steps li { counter-increment: step; display: flex; align-items: center; gap: 12px; font-size: 15px; line-height: 1.35; }
.steps li::before { content: counter(step); flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--chip); color: var(--ink); font-weight: 700; font-size: 13px; }
.steps .ic { display: inline-grid; place-items: center; vertical-align: -4px; width: 22px; height: 22px; border-radius: 6px; background: var(--chip); margin-inline: 2px; }
.steps .ic svg { width: 14px; height: 14px; }

@media (max-height: 760px) { .fact p { font-size: 15px; line-height: 20px; min-height: 60px; } .bird-name { font-size: 23px; line-height: 28px; } .count { font-size: 26px; line-height: 30px; } }
@media (prefers-reduced-motion: reduce) {
  .holder *, .play .bars i { animation: none !important; }
  .holder, .sheet, .backdrop, .glow, .ring .fill-c { transition: none; }
}
</style>

</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <filter id="wob" filterUnits="userSpaceOnUse" x="-40" y="-60" width="340" height="310">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="1" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="wobS" filterUnits="userSpaceOnUse" x="-20" y="-20" width="360" height="290">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="1" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="wobB" filterUnits="userSpaceOnUse" x="-170" y="-280" width="380" height="320">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="1" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>

<main class="app" id="app">
  <header class="top">
    <div class="top-left">
      <button class="round" id="howBtn" aria-haspopup="dialog" aria-label="how birdcrab works" title="how birdcrab works">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M6.2 6.3a1.9 1.9 0 1 1 2.6 1.8c-.6.3-.8.7-.8 1.3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="8" cy="11.6" r="1" fill="currentColor"/></svg>
      </button>
      <button class="round install" id="installBtn" aria-haspopup="dialog" aria-label="add birdcrab to your home screen" title="add to home screen">
        <span id="installGlyph"></span>
        <span class="badge" aria-hidden="true">+</span>
      </button>
    </div>
    <button class="when" id="whenBtn" aria-haspopup="dialog">
      <span class="when-line">
        <span id="whenDay">today</span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </span>
      <span class="sub" id="whenSlot">(morning bird)</span>
    </button>
    <div class="units" role="group" aria-label="size unit">
      <button id="unitIn" aria-pressed="true" aria-label="inches">in</button>
      <button id="unitCm" aria-pressed="false" aria-label="centimeters">cm</button>
    </div>
  </header>

  <button class="wx" id="wx" hidden></button>

  <section class="main" aria-label="this half-day's bird">
    <div class="stage" aria-hidden="true">
      <div class="glow" id="glow"></div>
      <div class="scene-stack">

  /* ---------- drawing helpers, in the weathercrab marker style ---------- */
  const INK = "#2b2522", CRAB = "#d97757";
  const n1 = (v) => Math.round(v * 10) / 10;
  const d = (strs, ...vals) => strs.reduce((a, s, i) => a + s + (i < vals.length ? (typeof vals[i] === "number" ? n1(vals[i]) : vals[i]) : ""), "");
  const stk = (w = 3.2) => `stroke="${INK}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"`;
  const sw = (w) => (w === 0 ? "" : w != null ? stk(w) : stk());
  const P = (p, fill, w) => `<path d="${p}" fill="${fill}" ${sw(w)}/>`;
  const R = (x, y, w, h, fill, rx = 3, s) => `<rect x="${n1(x)}" y="${n1(y)}" width="${n1(w)}" height="${n1(h)}" rx="${rx}" fill="${fill}" ${sw(s)}/>`;
  const E = (cx, cy, rx, ry, fill, s, rot) => `<ellipse cx="${n1(cx)}" cy="${n1(cy)}" rx="${n1(rx)}" ry="${n1(ry)}" fill="${fill}" ${sw(s)}${rot ? ` transform="rotate(${n1(rot)} ${n1(cx)} ${n1(cy)})"` : ""}/>`;
  const Ci = (cx, cy, r, fill, s) => `<circle cx="${n1(cx)}" cy="${n1(cy)}" r="${n1(r)}" fill="${fill}" ${sw(s)}/>`;
  const L = (p, w = 2.2, c = INK, extra = "") => `<path d="${p}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" ${extra}/>`;
  const thick = (p, w, c, o = 2.6) => L(p, w + o, INK) + L(p, w, c);
  const G = (tr, inner, cls) => `<g${cls ? ` class="${cls}"` : ""} transform="${tr}">${inner}</g>`;
  const mirror = (s) => `<g transform="matrix(-1 0 0 1 240 0)">${s}</g>`;
  function mix(a, b, t) {
    const p = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
    const x = p(a), y = p(b);
    return "#" + x.map((v, i) => Math.round(v + (y[i] - v) * t).toString(16).padStart(2, "0")).join("");
  }
  const shade = (c, t) => (t < 0 ? mix(c, "#000000", -t) : mix(c, "#ffffff", t));

  /* ---------- the crab: weathercrab's mascot, now birdwatching in a bucket hat ---------- */
  const HAT = "#c9b98f", HAT_BAND = "#5f7350", BINO = "#3b3330";
  const crabLegs = () => [60, 84, 144, 168].map((x, i) => `<g class="leg l${i}">${R(x, 156, 12, 32, CRAB, 2)}${R(x - 3.5, 183, 19, 11, "#6b5240", 5)}</g>`).join("");
  const raised = () => P("M186 118 L198 118 L198 100 L222 100 L222 142 L186 142 Z", CRAB);
  const bucketHat = () => G("translate(0 -14)",
    P("M78 76 Q78 40 120 38 Q162 40 162 76 Z", HAT) +
    `<path d="M78.5 62 Q120 57 161.5 62 L161.8 71 Q120 66 78.2 71 Z" fill="${HAT_BAND}"/>` +
    P("M48 84 Q120 62 192 84 Q188 93 174 88 Q120 76 66 88 Q52 93 48 84 Z", HAT));
  const binoculars = () => `<g class="bino">` +
    R(94, 96, 52, 14, "#4a403a", 5) + R(112, 84, 16, 12, "#4a403a", 3) +
    R(52, 84, 44, 38, BINO, 10) + R(144, 84, 44, 38, BINO, 10) +
    Ci(74, 103, 12, "#7fa6c9") + Ci(166, 103, 12, "#7fa6c9") +

    else if (o.legs === "cling") s += thick(d`M${o.bx - 4} ${o.by + 10} L-2 -1`, 2.2, legC, 2.2) + thick(d`M${o.bx - 2} ${o.by - 4} L0 -14`, 2.2, legC, 2.2) + L("M-2 0 L-7 -2 M0 -14 L-5 -16", 2.2);

    /* neck, under the body and head */
    const [n0x, n0y] = rot(-bw * .7, -bh * .3);
    if (o.neck) s += thick(d`M${n0x} ${n0y} Q${o.neck[0]} ${o.neck[1]} ${hx + hr * .2} ${hy + hr * .3}`, o.nw, c.n || head, BW * 2);

    /* body, belly and body markings, in the body's own frame */
    let inner = E(-bw * .3, bh * .58, bw * .85, bh * .72, belly, 0);
    if (m.chest) inner += E(-bw * .78, bh * .12, bw * .42, bh * .82, m.chest, 0);
    if (m.flank) inner += E(bw * .12, bh * .4, bw * .55, bh * .42, m.flank, 0);
    if (m.stripe) inner += E(-bw * .05, bh * .1, bw * .9, bh * .1, m.stripe, 0);
    if (m.band) inner += E(-bw * .55, bh * .25, bw * .22, bh * .9, m.band, 0);
    if (m.spots) inner += [[-.7, .3], [-.5, .55], [-.3, .35], [-.55, .05], [-.15, .62], [-.05, .3], [-.35, .8], [.1, .55]].map(([x, y]) => Ci(bw * x, bh * y, Math.max(1.4, bh * .09), m.spots, 0)).join("");
    if (m.speckle) inner += [[-.7, -.2], [-.5, .4], [-.3, -.4], [-.2, .1], [0, -.6], [.1, .3], [.3, -.2], [.45, .4], [-.45, -.7], [.25, .7], [-.65, .65], [.6, -.3]].map(([x, y]) => Ci(bw * x, bh * y, 1.3, m.speckle, 0)).join("");
    if (m.bars) inner += [-.15, .15, .45, .75].map((y) => L(d`M${-bw * .95} ${bh * y} Q${-bw * .5} ${bh * y + 2.5} ${-bw * .05} ${bh * y}`, 1.6, m.bars)).join("");
    let wingS = "";
    if (o.wings !== "none") {
      const wr = o.wingRot ?? 6;
      wingS = E(bw * .12, -bh * .1, bw * .7, bh * .62, wing, BW, wr);
      if (m.patch) wingS += E(-bw * .22, -bh * .22, bw * .24, bh * .3, m.patch, BW, wr);
      if (m.wingbars) wingS += L(d`M${-bw * .2} ${-bh * .38} Q${bw * .05} ${-bh * .1} ${-bw * .05} ${bh * .3} M${bw * .05} ${-bh * .42} Q${bw * .28} ${-bh * .12} ${bw * .18} ${bh * .3}`, 2, m.wingbars);
      if (m.wingtip) wingS += P(d`M${bw * .55} ${-bh * .45} Q${bw * .9} ${-bh * .1} ${bw * .82} ${bh * .1} Q${bw * .6} ${bh * .2} ${bw * .5} ${bh * .05} Z`, m.wingtip, 0);
      wingS += L(d`M${bw * .38} ${-bh * .2} L${bw * .7} ${-bh * .02} M${bw * .3} ${bh * .05} L${bw * .62} ${bh * .2}`, 1.3, INK, 'opacity=".45"');
    }
    s += G(d`translate(${o.bx} ${o.by}) rotate(${o.tilt})`,
      `<defs><clipPath id="${id}c"><ellipse rx="${bw}" ry="${bh}"/></clipPath></defs>` +
      E(0, 0, bw, bh, body, 0) + `<g clip-path="url(#${id}c)">${inner}</g>` + E(0, 0, bw, bh, "none", BW) + wingS);

    if (o.wings === "blur") { const [wx, wy] = rot(bw * .2, -bh * .6); s += G(d`translate(${wx} ${wy}) rotate(-42)`, `<g class="blur">${E(0, -14, 4.5, 14, "rgba(232,240,244,.55)", 1.4)}</g>`); }
    if (m.collar && o.neck) { const t = .3, qx = (1 - t) ** 2 * n0x + 2 * (1 - t) * t * o.neck[0] + t * t * hx, qy = (1 - t) ** 2 * n0y + 2 * (1 - t) * t * o.neck[1] + t * t * hy; s += E(qx, qy, o.nw * .62, 2.4, m.collar, 1.2); }

    /* crest, behind the head */
    const cc = c.c || head, k = o.cs || 1;
    if (o.crest === "point") s += P(d`M${hx - hr * .35} ${hy - hr * .82} Q${hx + hr * .15} ${hy - hr * 1.8 * k} ${hx + hr * 1.1 * k} ${hy - hr * 1.7 * k} Q${hx + hr * .7} ${hy - hr * .95} ${hx + hr * .88} ${hy - hr * .3} Z`, cc, BW);
    else if (o.crest === "shaggy") s += P(d`M${hx - hr * .45} ${hy - hr * .82} L${hx + hr * .05} ${hy - hr * 1.5 * k} L${hx + hr * .32} ${hy - hr * 1.0} L${hx + hr * .82} ${hy - hr * 1.42 * k} L${hx + hr * .8} ${hy - hr * .82} L${hx + hr * 1.3 * k} ${hy - hr * .9 * k} L${hx + hr * .9} ${hy - hr * .2} Z`, cc, BW);
    else if (o.crest === "fan") { for (let i = 0; i < 6; i++) { const a = -150 + i * 22, len = hr * 1.7 * k; s += G(d`translate(${hx + hr * .1} ${hy - hr * .5}) rotate(${a + 90})`, E(0, -len / 2, hr * .2, len / 2, cc, BW) + (m.cresttip ? E(0, -len + hr * .2, hr * .17, hr * .22, m.cresttip, 0) : "")); } }
    else if (o.crest === "quills") { for (let i = 0; i < 5; i++) s += thick(d`M${hx + hr * .5} ${hy - hr * .3} Q${hx + hr * 1.3} ${hy - hr * (.7 + i * .25)} ${hx + hr * (1.7 + i * .12)} ${hy - hr * (.2 + i * .42)}`, 1.6, cc, 2); }
    else if (o.crest === "topknot") { for (let i = 0; i < 5; i++) { const ex = hx - hr * .25 + i * hr * .22, ey = hy - hr * 2.1 + Math.abs(i - 2) * hr * .12; s += L(d`M${hx + (i - 2) * hr * .08} ${hy - hr * .9} L${ex} ${ey}`, 1.3) + Ci(ex, ey, hr * .17, cc, 1.2); } }

    /* head and head markings */
    s += `<defs><clipPath id="${id}h"><circle cx="${n1(hx)}" cy="${n1(hy)}" r="${hr}"/></clipPath></defs>`;
    let hm = "";
    if (m.throat) hm += E(hx - hr * .15, hy + hr * 1.0, hr * .8, hr * .55, m.throat, 0);
    if (m.cheek) hm += E(hx + hr * .08, hy + hr * .3, hr * .55, hr * .34, m.cheek, 0);
    if (m.nape) hm += E(hx + hr * .85, hy + hr * .1, hr * .45, hr * .9, m.nape, 0);
    if (m.cap) hm += R(hx - hr - 1, hy - hr - 1, hr * 2 + 2, hr * .85 + 1, m.cap, 0, 0);
    if (m.face) hm += E(hx - hr * .95, hy + hr * .18, hr * .58, hr * .58, m.face, 0);
    if (m.mask) hm += E(hx - hr * .45, hy - hr * .12, hr * .85, hr * .3, m.mask, 0);
    if (m.stripe2) hm += E(hx + hr * .2, hy - hr * .15, hr * 1.1, hr * .13, m.stripe2, 0);
    if (m.brow) hm += E(hx - hr * .05, hy - hr * .5, hr * .72, hr * .13, m.brow, 0);
    if (m.bare) hm += E(hx - hr * .42, hy + hr * .02, hr * .52, hr * .48, m.bare, 0);
    if (m.earpatch) hm += E(hx + hr * .25, hy + hr * .1, hr * .38, hr * .62, m.earpatch, 0, -20);
    s += Ci(hx, hy, hr, head, 0) + `<g clip-path="url(#${id}h)">${hm}</g>` + Ci(hx, hy, hr, "none", BW);

    /* wattles and snoods (turkeys), under and over the beak */
    const bx0 = hx - hr * .82, by0 = hy + (o.bdy ?? hr * .12);
    if (m.wattle) s += P(d`M${bx0 + 2} ${by0 + 2} Q${bx0 - 2} ${by0 + 16} ${bx0 + 6} ${by0 + 18} Q${bx0 + 10} ${by0 + 10} ${bx0 + 6} ${by0 + 2} Z`, m.wattle, BW);
    s += G(d`translate(${bx0} ${by0})`, beakSVG(o.beak, o.bl, o.bh2 || hr * (o.beak === "cone" ? .42 : o.beak === "big" ? .78 : o.beak === "parrot" ? .62 : o.beak === "puffin" ? .72 : o.beak === "pouch" ? .3 : o.beak === "shoe" ? .7 : o.beak === "duck" ? .36 : o.beak === "curved" || o.beak === "upcurve" ? 2.6 / hr : .3), beakC, { tip: c.kt, cere: c.cere, lower: c.kl }));
    if (m.snood) s += thick(d`M${bx0 + 1} ${by0 - hr * .3} Q${bx0 - 6} ${by0 - 2} ${bx0 - 4} ${by0 + 8}`, 2.6, m.snood, 2);

    /* eye */
    const ex = hx - hr * .3 + (o.exo || 0), ey = hy - hr * .2, er = Math.max(1.9, hr * .16);
    let eye = "";
    if (m.ring) eye += Ci(ex, ey, er * 1.9, m.ring, 0);
    if (c.e) eye += Ci(ex, ey, er * 1.45, c.e, 1.2) + Ci(ex, ey, er * .8, INK, 0);
    else eye += Ci(ex, ey, er, INK, 0);
    eye += Ci(ex - er * .32, ey - er * .35, er * .34, "#ffffff", 0);
    s += `<g class="beye">${eye}</g>`;
    return s;
  }

  /* owls and penguins look straight at you */
  function frontBird(b) {
    const o = { ...ARCH[b.a], ...(b.x || {}) };
    const c = b.c, m = b.m || {};
    const id = "bc" + (++UID);
    const { bw, bh, by, hr } = o;
    let s = "";
    if (o.front === "owl") {
      const hy = by - bh * .95, legC = c.l || "#f3c95c";
      s += E(-bw * .95, by + 2, bw * .38, bh * .8, c.w || shade(c.b, -.1), BW, 12) + E(bw * .95, by + 2, bw * .38, bh * .8, c.w || shade(c.b, -.1), BW, -12);
      s += `<defs><clipPath id="${id}c"><ellipse cx="0" cy="${by}" rx="${bw}" ry="${bh}"/></clipPath></defs>` + E(0, by, bw, bh, c.b, 0);
      let inner = E(0, by + bh * .3, bw * .7, bh * .85, c.u || c.b, 0);
      if (m.bars) inner += [-.2, .1, .4, .7].map((y) => L(d`M${-bw * .6} ${by + bh * y} Q0 ${by + bh * y + 3} ${bw * .6} ${by + bh * y}`, 1.6, m.bars, 'stroke-dasharray="5 4"')).join("");
      if (m.spots) inner += [[-.45, -.1], [.1, -.25], [.5, 0], [-.2, .25], [.3, .35], [-.5, .5], [.05, .6], [.5, .7]].map(([x, y]) => E(bw * x, by + bh * y, 2.6, 1.7, m.spots, 0)).join("");
      s += `<g clip-path="url(#${id}c)">${inner}</g>` + E(0, by, bw, bh, "none", BW);
      if (o.ears) s += P(d`M${-hr * .85} ${hy - hr * .55} L${-hr * .95} ${hy - hr * 1.5} L${-hr * .3} ${hy - hr * .85} Z`, c.h || c.b, BW) + P(d`M${hr * .85} ${hy - hr * .55} L${hr * .95} ${hy - hr * 1.5} L${hr * .3} ${hy - hr * .85} Z`, c.h || c.b, BW);
      s += Ci(0, hy, hr, c.h || c.b, BW);
      if (m.throat) s += E(0, hy + hr * .82, hr * .5, hr * .22, m.throat, 0);
      s += o.heart
        ? P(d`M0 ${hy - hr * .55} Q${-hr * .55} ${hy - hr * 1.05} ${-hr * .85} ${hy - hr * .45} Q${-hr * 1.05} ${hy + hr * .35} 0 ${hy + hr * .9} Q${hr * 1.05} ${hy + hr * .35} ${hr * .85} ${hy - hr * .45} Q${hr * .55} ${hy - hr * 1.05} 0 ${hy - hr * .55} Z`, c.f || "#f6f1e8", BW)
        : Ci(-hr * .42, hy + hr * .02, hr * .5, c.f || shade(c.h || c.b, .2), 1.6) + Ci(hr * .42, hy + hr * .02, hr * .5, c.f || shade(c.h || c.b, .2), 1.6);
      if (m.brow) s += L(d`M${-hr * .8} ${hy - hr * .5} Q${-hr * .4} ${hy - hr * .75} ${-hr * .08} ${hy - hr * .3} M${hr * .8} ${hy - hr * .5} Q${hr * .4} ${hy - hr * .75} ${hr * .08} ${hy - hr * .3}`, 2.4, m.brow);
      const er = hr * (o.heart ? .17 : .27);
      const eyes = [-1, 1].map((sd) => (c.e ? Ci(sd * hr * .42, hy + hr * .02, er, c.e, 1.4) + Ci(sd * hr * .42, hy + hr * .02, er * .52, INK, 0) : Ci(sd * hr * .42, hy + hr * .02, er, INK, 0)) + Ci(sd * hr * .42 - er * .3, hy - er * .3, er * .26, "#ffffff", 0)).join("");
      s += `<g class="beye">${eyes}</g>`;
      s += P(d`M${-hr * .14} ${hy + hr * .22} L${hr * .14} ${hy + hr * .22} L0 ${hy + hr * .55} Z`, c.k || "#5a4a3a", 1.6);
      if (b.p === "branch" || !b.p) s += [-8, 8].map((x) => L(d`M${x - 5} 1 L${x - 5} -4 M${x} 1 L${x} -5 M${x + 5} 1 L${x + 5} -4`, 2.6, legC === "#f3c95c" ? "#3b3330" : legC)).join("");
      else s += [-9, 9].map((x) => thick(d`M${x} ${by + bh * .8} L${x} -1`, o.leg ? 3 : 4, legC, 2.2) + L(d`M${x} 0 L${x - 6} 1 M${x} 0 L${x + 5} 1`, 2.4)).join("");
    } else {
      const hy = by - bh * .92;
      s += E(-bw * .95, by + bh * .05, bw * .22, bh * .55, c.w || c.b, BW, 18) + E(bw * .95, by + bh * .05, bw * .22, bh * .55, c.w || c.b, BW, -18);
      s += [-10, 10].map((x) => E(x, -2, 9, 4, c.l || "#3b3330", BW)).join("");
      s += `<defs><clipPath id="${id}c"><ellipse cx="0" cy="${by}" rx="${bw}" ry="${bh}"/></clipPath></defs>` + E(0, by, bw, bh, c.b, 0) +
        `<g clip-path="url(#${id}c)">${E(0, by + bh * .18, bw * .7, bh * .9, c.u || "#f6f1e8", 0)}${m.chest ? E(0, by - bh * .62, bw * .62, bh * .22, m.chest, 0) : ""}</g>` + E(0, by, bw, bh, "none", BW);
      s += Ci(0, hy, hr, c.h || c.b, BW);
      if (m.earpatch) s += E(-hr * .82, hy + hr * .45, hr * .28, hr * .5, m.earpatch, 1.4, 20) + E(hr * .82, hy + hr * .45, hr * .28, hr * .5, m.earpatch, 1.4, -20);
      s += `<g class="beye">${[-1, 1].map((sd) => Ci(sd * hr * .38, hy - hr * .1, 2.2, "#121214", 0) + Ci(sd * hr * .38 - .7, hy - hr * .1 - .8, .8, "#ffffff", 0)).join("")}</g>`;
      s += P(d`M${-hr * .2} ${hy + hr * .2} L${hr * .2} ${hy + hr * .2} L0 ${hy + hr * 1.05} Z`, c.k || "#3b3330", 1.6) + L(d`M${-hr * .1} ${hy + hr * .32} L0 ${hy + hr * .8}`, 2, c.kt || "#e2804f");
    }
    return s;
  }

  const birdShape = (b) => (ARCH[b.a].front ? frontBird(b) : sideBird(b));
  const perchOf = (b) => b.p || ARCH[b.a].perch;
  const moveOf = (b) => (b.x && b.x.move) || ARCH[b.a].move;

  /* the whole scene: ground, perch, the crab on the left, the bird on the right */
  function sceneSVG(b, opts = {}) {
    const p = perchOf(b), at = PERCH[p].at, sc = b.s || 1;
    const flat = !!opts.flat;
    const bird = `<g class="bird" data-move="${moveOf(b)}"><g transform="translate(${at[0]} ${at[1]}) scale(${sc})"><g class="bmove"><g${opts.land ? ' class="land"' : ""}><g${flat ? "" : ' filter="url(#wobB)"'}>${birdShape(b)}</g></g></g></g></g>`;
    const back = `<g${flat ? "" : ' filter="url(#wobS)"'}>${perchBack(p)}</g>`;
    const front = perchFront(p, at);
    if (opts.mini) return `<svg viewBox="136 24 184 202" role="img" aria-label="${esc(b.n)}">${back}${bird}${front}</svg>`;
    const crab = G("translate(10 107.3) scale(.55)", crabSVG({ flat, move: opts.hop ? "hop" : "sway" }));
    return `<svg class="scene" viewBox="0 0 320 240" role="img" aria-label="the crab watching a ${esc(b.n)} through binoculars">${back}${crab}${bird}${front}</svg>`;
  }
  /* ---------- the half-day clock: a new bird at 12am and 12pm local time ---------- */
  const N = BIRDS.length;
  const slotOf = (t) => Math.round(Date.UTC(t.getFullYear(), t.getMonth(), t.getDate()) / 864e5) * 2 + (t.getHours() >= 12 ? 1 : 0);
  function slotStart(n) {
    const day = new Date(Math.floor(n / 2) * 864e5);
    return new Date(day.getUTCFullYear(), day.getUTCMonth(), day.getUTCDate(), (((n % 2) + 2) % 2) * 12);
  }
  const EPOCH = slotOf(new Date(2026, 0, 1, 0));
  const birdIdx = (n) => (((n - EPOCH) % N) + N) % N;
  const birdAt = (n) => BIRDS[birdIdx(n)];
  const factAt = (n) => { const b = birdAt(n), lap = Math.floor((n - EPOCH) / N); return b.f[((lap % b.f.length) + b.f.length) % b.f.length]; };
  const BACK = 13;

  const WEEK = ["sun", "mon", "tue", "wed", "thu", "fri", "sat"];
  const MONTHS = ["jan", "feb", "mar", "apr", "may", "jun", "jul", "aug", "sep", "oct", "nov", "dec"];
  const half = (n) => ((((n % 2) + 2) % 2) ? "pm" : "am");
  function dayLabel(n, cur) {
    const dd = Math.floor(n / 2) - Math.floor(cur / 2), t = slotStart(n);
    if (dd === 0) return "today";
    if (dd === -1) return "yesterday";
    return `${WEEK[t.getDay()]}, ${MONTHS[t.getMonth()]} ${t.getDate()}`;
  }
  const shortSlot = (n, cur) => (n === cur ? "now" : `${Math.floor(n / 2) === Math.floor(cur / 2) ? "today" : Math.floor(n / 2) === Math.floor(cur / 2) - 1 ? "yest." : WEEK[slotStart(n).getDay()]} ${half(n)}`);

  /* ---------- sizes ---------- */
  function sizeText(b) {
    let v;
    if (state.unit === "cm") v = b.cm >= 100 ? `${(b.cm / 100).toFixed(2).replace(/0$/, "")} m` : `${b.cm} cm`;
    else {
      const inch = b.cm / 2.54;
      if (inch < 30) v = `${inch < 6 ? Math.round(inch * 2) / 2 : Math.round(inch)} in`;
      else { const ft = Math.floor(Math.round(inch) / 12), rest = Math.round(inch) - ft * 12; v = rest ? `${ft} ft ${rest} in` : `${ft} ft`; }
    }
    return b.ht ? `stands ${v} tall` : `${v} long${b.note ? ` ${b.note}` : ""}`;
  }

  /* ---------- state ---------- */
  const state = { n: slotOf(new Date()), view: 0, unit: saved.unit === "cm" ? "cm" : "in", seen: new Set(Array.isArray(saved.seen) ? saved.seen.filter(Number.isFinite) : []), activeHolder: $("#holderA") };
  state.view = state.n;
  function persist() { store.set({ unit: state.unit, seen: [...state.seen].sort((a, b) => a - b).slice(-400), wx: wx.data, wxAsked: wx.asked }); }
  function markSeen() { if (!state.seen.has(state.n)) { state.seen.add(state.n); persist(); } }
  const lifeCount = () => new Set([...state.seen].map(birdIdx)).size;

  /* ---------- render ---------- */
  const PIN = `<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21 3 3 10.5l7.6 2.9L13.5 21z"/></svg>`;
  const RULER = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><rect x="1.5" y="5" width="13" height="6" rx="1.2"/><path d="M4.5 5v2.4M7 5v3.2M9.5 5v2.4M12 5v3.2" stroke-linecap="round"/></svg>`;
  function swapScene(html) {
    const next = state.activeHolder.id === "holderA" ? $("#holderB") : $("#holderA");
    next.innerHTML = html;
    next.classList.add("on");
    state.activeHolder.classList.remove("on");
    state.activeHolder = next;
  }
  function render(anim) {
    const n = state.view, b = birdAt(n), cur = state.n;
    if (snd.for && snd.for !== b.n) { audio.pause(); snd.for = null; }
    swapScene(sceneSVG(b, { land: anim && !reduced, hop: anim && n === cur && !reduced }));
    document.documentElement.style.setProperty("--glow", b.gl);
    $("#birdName").textContent = b.n;
    $("#birdSci").textContent = b.sci;
    renderChips();
    renderListen();
    $("#factText").textContent = factAt(n);
    $("#factNum").textContent = `· NO. ${n - EPOCH + 1}`;
    $("#whenDay").textContent = dayLabel(n, cur);
    $("#whenSlot").textContent = `(${half(n)} bird)`;
    $("#prevBtn").disabled = n <= cur - BACK;
    $("#nextBtn").disabled = n >= cur;
    renderNote();
    setFx(snd.for === b.n && !audio.paused ? "notes" : fxFor(b));
  }
  function renderChips() {
    const b = birdAt(state.view);
    $("#chips").innerHTML = `<span class="chip">${PIN}<span>${esc(b.w)}</span></span><span class="chip">${RULER}<span>${esc(sizeText(b))}</span></span>`;
  }
  function renderNote() {
    const note = $("#note");
    if (state.view === state.n) note.textContent = "a new bird lands at 12am and 12pm your time";
    else note.innerHTML = `looking back at ${esc(dayLabel(state.view, state.n))}'s ${half(state.view)} bird · <button id="nowBtn">back to the current bird</button>`;
  }
  function go(n) {
    n = Math.max(state.n - BACK, Math.min(state.n, n));
    if (n === state.view) return;
    state.view = n;
    render(false);
    $("#live").textContent = `${dayLabel(n, state.n)}, ${half(n)}: ${birdAt(n).n}`;
  }
  $("#prevBtn").addEventListener("click", () => go(state.view - 1));
  $("#nextBtn").addEventListener("click", () => go(state.view + 1));
  $("#note").addEventListener("click", (e) => { if (e.target.closest("#nowBtn")) go(state.n); });
  document.addEventListener("keydown", (e) => {
    if (openSheet) { if (e.key === "Escape") closeSheet(); return; }
    if (e.target.closest && e.target.closest("input, textarea")) return;
    if (e.key === "ArrowLeft") go(state.view - 1);
    else if (e.key === "ArrowRight") go(state.view + 1);
  });

  function renderUnit() {
    $("#unitIn").setAttribute("aria-pressed", state.unit === "in");
    $("#unitCm").setAttribute("aria-pressed", state.unit === "cm");
  }
  function setUnit(u) { if (u === state.unit) return; state.unit = u; persist(); renderUnit(); renderChips(); renderWx(); }
  $("#unitIn").addEventListener("click", () => setUnit("in"));
  $("#unitCm").addEventListener("click", () => setUnit("cm"));

  /* ---------- the countdown ---------- */
  const RING = 2 * Math.PI * 19;
  const pad = (v) => String(v).padStart(2, "0");
  function countParts(ms) {
    const s = Math.max(0, Math.ceil(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    return { h, m, sec };
  }
  function tick() {
    const now = new Date(), cur = slotOf(now);
    if (cur !== state.n) {
      const follow = state.view === state.n;
      state.n = cur;
      markSeen();
      if (follow) { state.view = cur; render(true); $("#live").textContent = `a new bird landed: ${birdAt(cur).n}`; }
      else { state.view = Math.max(state.view, cur - BACK); render(false); }
      if (openSheet === $("#logSheet")) renderLog();
    }
    const start = slotStart(cur), end = slotStart(cur + 1);
    const left = end - now, prog = Math.min(1, Math.max(0, (now - start) / (end - start)));
    const { h, m, sec } = countParts(left);
    $("#count").innerHTML = `${h}<span class="u">h</span>${pad(m)}<span class="u">m</span>${pad(sec)}<span class="u">s</span>`;
    $("#timer").setAttribute("aria-label", `next bird lands in ${h} hours ${m} minutes`);
    $("#ringFill").setAttribute("stroke-dashoffset", (RING * (1 - prog)).toFixed(2));
    $("#ringHand").setAttribute("transform", `rotate(${(prog * 360).toFixed(1)} 24 24)`);
    const nc = $("#nextCount");
    if (nc) nc.textContent = `in ${h}:${pad(m)}:${pad(sec)}`;
  }
  function loop() { tick(); setTimeout(loop, 1000 - (Date.now() % 1000) + 8); }

  /* ---------- fx: song notes, drifting feathers, snow ---------- */
  function fxFor(b) {
    const w = wx.data && Date.now() - wx.data.at < 3 * 36e5 ? wxKind(wx.data.code, wx.data.day) : "";
    if (w === "rain" || w === "storm") return "rain";
    if (w === "snow") return "snow";
    const p = perchOf(b);
    if (p === "snow" || p === "ice") return "snow";
    if (["song", "parrot", "kingf", "hummer"].includes(b.a) && b.n !== "common raven") return "notes";
    return "feathers";
  }
  const fx = { cv: $("#fx"), ctx: null, mode: null, parts: [], raf: 0, last: 0, w: 0, h: 0 };
  fx.ctx = fx.cv.getContext("2d");
  function sizeFx() {
    const r = fx.cv.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1);
    fx.w = r.width; fx.h = r.height;
    fx.cv.width = Math.round(r.width * dpr); fx.cv.height = Math.round(r.height * dpr);
    fx.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function spawn(p, initial) {
    if (fx.mode === "notes") {
      p.x = fx.w * (.58 + Math.random() * .2); p.y = fx.h * (.3 + Math.random() * .16);
      p.v = 12 + Math.random() * 10; p.ph = Math.random() * 6.28; p.life = 0; p.max = 2.6 + Math.random() * 1.4;
      p.delay = initial ? Math.random() * 3 : .4 + Math.random() * 2.2; p.g = Math.random() < .5 ? "♪" : "♫"; p.sz = 12 + Math.random() * 5;
    } else if (fx.mode === "feathers") {
      p.x = fx.w * (.1 + Math.random() * .85); p.y = initial ? Math.random() * fx.h : -12;
      p.v = 9 + Math.random() * 9; p.ph = Math.random() * 6.28; p.len = 7 + Math.random() * 5;
    } else if (fx.mode === "rain") {
      p.x = Math.random() * (fx.w + fx.h * .12) - fx.h * .12; p.y = initial ? Math.random() * fx.h : -12;
      p.v = 230 + Math.random() * 120; p.len = 7 + Math.random() * 6;
    } else {
      p.x = Math.random() * fx.w; p.y = initial ? Math.random() * fx.h : -8;
      p.v = 16 + Math.random() * 20; p.r = 1.2 + Math.random() * 1.8; p.ph = Math.random() * 6.28;
    }
    return p;
  }
  function setFx(mode) {
    if (reduced) mode = null;
    if (mode === fx.mode) return;
    fx.mode = mode;
    sizeFx();
    const count = mode === "notes" ? 4 : mode === "feathers" ? 5 : mode === "snow" ? 34 : mode === "rain" ? 30 : 0;
    fx.parts = Array.from({ length: count }, () => spawn({}, true));
    if (mode && !fx.raf) { fx.last = performance.now(); fx.raf = requestAnimationFrame(frame); }
    if (!mode) fx.ctx.clearRect(0, 0, fx.w, fx.h);
  }
  function frame(now) {
    const dt = Math.min(.05, (now - fx.last) / 1000); fx.last = now;
    const c = fx.ctx; c.clearRect(0, 0, fx.w, fx.h);
    if (!fx.mode) { fx.raf = 0; return; }
    if (fx.mode === "notes") {
      c.textAlign = "center";
      for (const p of fx.parts) {
        if (p.delay > 0) { p.delay -= dt; continue; }
        p.life += dt; p.y -= p.v * dt; p.ph += dt * 3;
        if (p.life > p.max) { spawn(p); continue; }
        const a = Math.sin(Math.PI * (p.life / p.max));
        c.globalAlpha = a * .75; c.fillStyle = "#efe9e1"; c.font = `700 ${p.sz}px "Comic Neue", "Comic Sans MS", sans-serif`;
        c.fillText(p.g, p.x + Math.sin(p.ph) * 5, p.y);
      }
      c.globalAlpha = 1;
    } else if (fx.mode === "feathers") {
      c.lineCap = "round";
      for (const p of fx.parts) {
        p.y += p.v * dt; p.ph += dt * 1.6;
        if (p.y > fx.h + 14) spawn(p);
        const x = p.x + Math.sin(p.ph) * 14, ang = Math.sin(p.ph) * .7 + .4;
        c.save(); c.translate(x, p.y); c.rotate(ang);
        c.fillStyle = "rgba(239,233,225,.32)"; c.beginPath(); c.ellipse(0, 0, p.len, p.len * .32, 0, 0, 6.283); c.fill();
        c.strokeStyle = "rgba(239,233,225,.5)"; c.lineWidth = 1; c.beginPath(); c.moveTo(-p.len - 3, 0); c.lineTo(p.len, 0); c.stroke();
        c.restore();
      }
    } else if (fx.mode === "rain") {
      c.strokeStyle = "rgba(160,195,230,.55)"; c.lineWidth = 1.5; c.lineCap = "round"; c.beginPath();
      for (const p of fx.parts) { p.y += p.v * dt; p.x += p.v * dt * .12; if (p.y > fx.h + 10) spawn(p); c.moveTo(p.x, p.y); c.lineTo(p.x - p.len * .12, p.y - p.len); }
      c.stroke();
    } else {
      c.fillStyle = "rgba(240,245,255,.85)";
      for (const p of fx.parts) {
        p.y += p.v * dt; p.ph += dt * 1.3;
        const x = p.x + Math.sin(p.ph) * 6;
        if (p.y > fx.h + 6) spawn(p);
        c.beginPath(); c.arc(x, p.y, p.r, 0, 6.283); c.fill();
      }
    }
    fx.raf = requestAnimationFrame(frame);
  }
  document.addEventListener("visibilitychange", () => {
    if (document.hidden && fx.raf) { cancelAnimationFrame(fx.raf); fx.raf = 0; }
    else if (!document.hidden) { if (fx.mode && !fx.raf) { fx.last = performance.now(); fx.raf = requestAnimationFrame(frame); } tick(); }
  });
  addEventListener("resize", () => { if (fx.mode) sizeFx(); });

  /* ---------- the bird's own voice: a short field recording per bird, played only when tapped ---------- */
  const QUIET = { shoebill: "shoebills hardly make a sound" };
  const PLAY_IC = `<svg viewBox="0 0 10 10" fill="currentColor" aria-hidden="true"><path d="M2.6 1.2 8.7 5 2.6 8.8z"/></svg>`;
  const STOP_IC = `<svg viewBox="0 0 10 10" fill="currentColor" aria-hidden="true"><rect x="2" y="2" width="6" height="6" rx="1"/></svg>`;
  const HUSH_IC = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 6h2.5l3.5-3v10l-3.5-3H2.5z M11 6l3.5 4 M14.5 6 11 10"/></svg>`;
  const audio = new Audio();
  audio.preload = "none";
  const snd = { for: null, raf: 0, failed: null };
  const stageEl = document.querySelector(".stage");
  const fmtLen = (s) => `0:${String(Math.round(s)).padStart(2, "0")}`;
  const slugOf = (b) => b.n.replace(/[^a-z0-9]+/g, "-");
  function renderListen() {
    const b = birdAt(state.view), s = SOUNDS[b.n];
    if (!s) {
      $("#listen").innerHTML = `<span class="quiet">${HUSH_IC}<span>${esc(QUIET[b.n] || "no recording yet")}</span></span>`;
      $("#credit").textContent = "";
      return;
    }
    const on = snd.for === b.n && !audio.paused;
    $("#listen").innerHTML = `<button class="play" id="playBtn" aria-pressed="${on}" aria-label="${on ? "stop" : "play"} the ${esc(b.n)}'s ${esc(s.kind || "recording")}"><span class="pi">${on ? STOP_IC : PLAY_IC}</span><span>${on ? "listening" : s.kind ? `hear its ${esc(s.kind)}` : "hear it"}</span>${on ? `<span class="bars" aria-hidden="true"><i></i><i></i><i></i></span>` : `<span class="dim">${fmtLen(s.len)}</span>`}</button>`;
    $("#credit").innerHTML = (snd.failed === b.n ? "that recording didn't load. tap play to try again · " : "") +
      `recorded by <a href="${esc(s.page)}" target="_blank" rel="noopener">${esc(s.by)}</a> · ${esc(s.lic)} · ${esc(s.from)}`;
  }
  function setProgress() {
    const btn = $("#playBtn");
    if (btn && audio.duration) btn.style.setProperty("--p", `${((audio.currentTime / audio.duration) * 100).toFixed(1)}%`);
  }
  function progress() { setProgress(); if (!audio.paused) snd.raf = requestAnimationFrame(progress); }
  audio.addEventListener("timeupdate", setProgress);
  function setSinging(on) {
    stageEl.classList.toggle("singing", on && !reduced);
    setFx(on ? "notes" : fxFor(birdAt(state.view)));
  }
  audio.addEventListener("playing", () => { setSinging(true); renderListen(); cancelAnimationFrame(snd.raf); progress(); });
  audio.addEventListener("pause", () => { cancelAnimationFrame(snd.raf); setSinging(false); renderListen(); });
  audio.addEventListener("ended", () => { snd.for = null; renderListen(); });
  audio.addEventListener("error", () => { if (snd.for) { snd.failed = snd.for; snd.for = null; setSinging(false); renderListen(); } });
  function toggleSound() {
    const b = birdAt(state.view);
    if (!SOUNDS[b.n]) return;
    if (snd.for === b.n && !audio.paused) { snd.for = null; audio.pause(); return; }
    snd.for = b.n; snd.failed = null;
    const url = new URL(`sounds/${slugOf(b)}.mp4`, location.href).href;
    if (audio.src !== url) audio.src = url;
    else audio.currentTime = 0;
    audio.play().catch((e) => {
      if (e && e.name === "AbortError") return;
      if (snd.for === b.n) { snd.failed = b.n; snd.for = null; renderListen(); }
    });
    renderListen();
  }
  $("#listen").addEventListener("click", (e) => { if (e.target.closest("#playBtn")) toggleSound(); });

  /* ---------- sheets ---------- */
  let openSheet = null, returnFocus = null;
  function showSheet(el, focusSel) {
    returnFocus = document.activeElement;
    el.hidden = false;
    openSheet = el;
    requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add("open")));
    setTimeout(() => (el.querySelector(focusSel) || el.querySelector("[data-close].round"))?.focus({ preventScroll: true }), reduced ? 0 : 60);
  }
  function closeSheet() {
    const el = openSheet; if (!el) return;
    openSheet = null;
    el.classList.remove("open");
    setTimeout(() => { el.hidden = true; }, reduced ? 0 : 320);
    returnFocus?.focus?.({ preventScroll: true });
  }
  document.querySelectorAll(".sheet-wrap").forEach((w) => w.addEventListener("click", (e) => { if (e.target.closest("[data-close]")) closeSheet(); }));

  /* bird log: the next egg, the current bird, and the last week */
  function renderLog() {
    const cur = state.n, got = lifeCount();
    $("#life").innerHTML = `<span>your life list</span><span class="bar"><i style="width:${((got / N) * 100).toFixed(1)}%"></i></span><span><b>${got}</b> of ${N}</span>`;
    let h = `<div class="log-card next" aria-label="next bird, still hatching"><span class="mini">${eggSVG()}</span><span class="lw">next</span><b>still hatching</b><span class="count-s" id="nextCount"></span></div>`;
    for (let n = cur; n >= cur - BACK; n--) {
      const b = birdAt(n), seen = state.seen.has(n);
      h += `<button class="log-card${n === state.view ? " sel" : ""}" data-n="${n}" aria-label="${esc(dayLabel(n, cur))} ${half(n)}: ${esc(b.n)}${seen ? ", spotted" : ""}"${n === state.view ? ' aria-current="true"' : ""}>
        <span class="mini">${sceneSVG(b, { mini: true, flat: true })}</span>
        <span class="lw${n === cur ? " now" : ""}">${esc(shortSlot(n, cur))}</span><b>${esc(b.n)}</b>
        <small${seen ? ' class="got"' : ""}>${seen ? "spotted" : "missed"}</small>
      </button>`;
    }
    $("#logList").innerHTML = h;
    tick();
  }
  const openLog = () => { renderLog(); showSheet($("#logSheet"), ".log-card.sel"); };
  $("#moreBtn").addEventListener("click", openLog);
  $("#whenBtn").addEventListener("click", openLog);
  $("#logList").addEventListener("click", (e) => {
    const b = e.target.closest("[data-n]"); if (!b) return;
    const n = +b.dataset.n;
    closeSheet();
    setTimeout(() => go(n), reduced ? 0 : 200);
  });

  /* how it works */
  $("#howBody").innerHTML = `
    <p><b>a new bird lands every 12 hours,</b> at 12am and 12pm wherever you are. the countdown shows how long until the next one.</p>
    <p><b>everyone gets the same bird</b> in the same half of the day, so you can compare notes with a friend.</p>
    <p><b>${N} birds take turns,</b> from backyard robins to emperor penguins. once all ${N} have visited, they come back around with a different field note.</p>
    <p><b>every sound is a real field recording</b> from xeno-canto or wikimedia commons, trimmed to about 10 seconds. the person who recorded it and its license show under each field note. sounds only play when you tap.</p>
    <p><b>the weather is yours,</b> from <a href="https://open-meteo.com" target="_blank" rel="noopener">open-meteo</a>, for wherever your phone says you are. birdcrab asks for your location once. if you'd rather not share it, tap the weather pill and it'll use a rough guess from your internet connection instead. the in/cm switch also flips °f and °c.</p>
    <p><b>your life list</b> counts the birds you caught while they were here, like the list real birders keep. it's saved in this browser only.</p>
    <p><b>the drawings are the crab's sketches,</b> not field guide plates. colors and shapes are close, not exact. sizes are typical adult lengths.</p>`;
  $("#howBtn").addEventListener("click", () => showSheet($("#howSheet")));

  /* ---------- add to home screen: android and chrome get the install prompt, everyone else gets steps ---------- */
  const installBtn = $("#installBtn");
  const glyph = (cls) => `<svg${cls ? ` class="${cls}"` : ""} viewBox="8 14 224 184" aria-hidden="true">${crabSVG({ flat: true })}</svg>`;
  $("#installGlyph").innerHTML = glyph("app-glyph");
  const installedApp = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  const isAndroid = /android/i.test(navigator.userAgent);
  const isIOS = !isAndroid && (/iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1));

  window.addEventListener("appinstalled", () => { installPrompt = null; updateInstall(); if (openSheet === $("#installSheet")) closeSheet(); });
  updateInstall();
  const SHARE_IC = `<span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7.5 7.5 12 3l4.5 4.5M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg></span>`;
  const PLUS_IC = `<span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M12 8.5v7M8.5 12h7"/></svg></span>`;
  const MENU_IC = `<span class="ic"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5.5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="18.5" r="2"/></svg></span>`;
  const INSTALL_IC = `<span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M12 7.5v6M9.5 11l2.5 2.5 2.5-2.5M8 21h8"/></svg></span>`;

  /* ---------- your weather: open-meteo for wherever you are ----------
     the browser asks for your location once. if you say no, nothing is looked up until you tap the pill,
     which then uses a rough guess from your connection instead (bigdatacloud's free lookup). */
  const WX_CODES = {
    0: "clear", 1: "mostly clear", 2: "partly cloudy", 3: "overcast", 45: "fog", 48: "freezing fog",
    51: "light drizzle", 53: "drizzle", 55: "heavy drizzle", 56: "freezing drizzle", 57: "freezing drizzle",
    61: "light rain", 63: "rain", 65: "heavy rain", 66: "freezing rain", 67: "freezing rain",
    71: "light snow", 73: "snow", 75: "heavy snow", 77: "snow grains",
    80: "light showers", 81: "showers", 82: "heavy showers", 85: "snow showers", 86: "heavy snow showers",
    95: "thunderstorm", 96: "thunderstorm & hail", 99: "thunderstorm & hail"
  };
  function wxKind(c, day) {
    if (c >= 95) return "storm";
    if ((c >= 71 && c <= 77) || c === 85 || c === 86) return "snow";
    if ((c >= 51 && c <= 67) || (c >= 80 && c <= 82)) return "rain";
    if (c === 45 || c === 48) return "fog";
    if (c === 3) return "cloud";
    if (c === 1 || c === 2) return day ? "partsun" : "partmoon";
    return day ? "sun" : "moon";
  }
  const CLOUD = "M4.6 13h7.2a2.9 2.9 0 0 0 .3-5.8A4.1 4.1 0 0 0 4.3 8.2 2.4 2.4 0 0 0 4.6 13z";
  const wxSvg = (inner) => `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${inner}</svg>`;
  const WX_IC = {
    sun: wxSvg('<circle cx="8" cy="8" r="3"/><path d="M8 1.5v1.6M8 12.9v1.6M1.5 8h1.6M12.9 8h1.6M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M3.4 12.6l1.1-1.1M11.5 4.5l1.1-1.1"/>'),
    moon: wxSvg('<path d="M12.8 10.2A5.3 5.3 0 0 1 5.8 3.2a5.3 5.3 0 1 0 7 7z"/>'),
    partsun: wxSvg('<path d="M5.5 2v1M2 5.5h1M3 3l.7.7M8 3l-.7.7"/><path d="M3.6 7.4a2.3 2.3 0 0 1 3.9-2.1"/><path d="' + CLOUD + '"/>'),
    partmoon: wxSvg('<path d="M7.6 4.6A2.6 2.6 0 0 1 4.2 2.1a2.6 2.6 0 0 0 1.4 4.9"/><path d="' + CLOUD + '"/>'),
    cloud: wxSvg('<path d="' + CLOUD + '"/>'),
    fog: wxSvg('<path d="M2.5 6h11M1.5 9h13M3.5 12h9"/>'),
    rain: wxSvg('<path d="M4.6 10h7.2a2.9 2.9 0 0 0 .3-5.8A4.1 4.1 0 0 0 4.3 5.2 2.4 2.4 0 0 0 4.6 10z"/><path d="M5.5 12.2 5 14M8.5 12.2 8 14M11.5 12.2 11 14"/>'),
    snow: wxSvg('<path d="M4.6 10h7.2a2.9 2.9 0 0 0 .3-5.8A4.1 4.1 0 0 0 4.3 5.2 2.4 2.4 0 0 0 4.6 10z"/><path d="M5.2 13h.1M8.2 14h.1M11.2 13h.1"/>'),
    storm: wxSvg('<path d="M4.6 10h7.2a2.9 2.9 0 0 0 .3-5.8A4.1 4.1 0 0 0 4.3 5.2 2.4 2.4 0 0 0 4.6 10z"/><path d="M8.6 10.5 7 13h2l-1.4 2.2"/>')
  };
  const wx = { data: saved.wx && typeof saved.wx.t === "number" ? saved.wx : null, asked: !!saved.wxAsked, state: "idle" };
  const temp = (c) => `${Math.round(state.unit === "cm" ? c : (c * 9) / 5 + 32)}°`;
  async function getJSON(url, ms) {
    const ac = new AbortController(), t = setTimeout(() => ac.abort(), ms);
    try { const r = await fetch(url, { signal: ac.signal }); if (!r.ok) throw new Error("http " + r.status); return await r.json(); }
    finally { clearTimeout(t); }
  }
  function preciseSpot() {
    return new Promise((res) => {
      if (!("geolocation" in navigator)) return res(null);
      const give = setTimeout(() => res(null), 15000);
      navigator.geolocation.getCurrentPosition(
        (p) => { clearTimeout(give); res({ lat: p.coords.latitude, lon: p.coords.longitude }); },
        (e) => { clearTimeout(give); res(e && e.code === 1 ? { denied: true } : null); },
        { timeout: 10000, maximumAge: 6e5 }
      );
    });
  }
  async function roughSpot() {
    try {
      const r = await getJSON("https://api.bigdatacloud.net/data/reverse-geocode-client", 6000);
      if (r.latitude != null && r.longitude != null) return { lat: r.latitude, lon: r.longitude, place: String(r.locality || r.city || "").toLowerCase(), rough: true };
    } catch (e) {}
    return null;
  }
  async function placeName(lat, lon) {
    try {
      const r = await getJSON(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=en`, 6000);
      return String(r.locality || r.city || r.principalSubdivision || "").toLowerCase();
    } catch (e) { return ""; }
  }
  function renderWx() {
    const el = $("#wx");
    if (wx.state === "hidden") { el.hidden = true; return; }
    el.hidden = false;
    const d = wx.data;
    if (d && wx.state !== "off") {
      const k = wxKind(d.code, d.day), cond = WX_CODES[d.code] || "";
      el.innerHTML = `${WX_IC[k]}<b>${temp(d.t)}</b><span>${esc(cond)}${d.place ? `<span class="dim"> · ${esc(d.place)}</span>` : ""}</span><span class="hl">h ${temp(d.hi)} l ${temp(d.lo)}</span>`;
      el.setAttribute("aria-label", `weather${d.place ? ` in ${d.place}` : ""}: ${temp(d.t)}, ${cond}, high ${temp(d.hi)}, low ${temp(d.lo)}. tap to refresh`);
    } else if (wx.state === "loading") {
      el.innerHTML = `${PIN}<span class="dim">finding your weather…</span>`;
      el.setAttribute("aria-label", "finding your weather");
    } else {
      el.innerHTML = `${PIN}<span>show the weather where you are</span>`;
      el.setAttribute("aria-label", "show the weather where you are");
    }
  }
  async function loadWeather(tapped) {
    if (wx.state === "loading") return;
    wx.state = "loading"; renderWx();
    let spot = await preciseSpot();
    wx.asked = true;
    if (spot && spot.denied) spot = tapped ? await roughSpot() : null;
    else if (!spot) spot = await roughSpot();
    if (!spot) { wx.state = wx.data ? "ok" : framed ? "hidden" : "off"; persist(); renderWx(); return; }
    try {
      const lat = spot.lat.toFixed(2), lon = spot.lon.toFixed(2);
      const [r, place] = await Promise.all([
        getJSON(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code,is_day&daily=temperature_2m_max,temperature_2m_min&forecast_days=1&timezone=auto`, 8000),
        spot.place ? spot.place : placeName(lat, lon)
      ]);
      wx.data = { t: r.current.temperature_2m, code: r.current.weather_code, day: !!r.current.is_day, hi: r.daily.temperature_2m_max[0], lo: r.daily.temperature_2m_min[0], place, at: Date.now() };
      wx.state = "ok";
      $("#live").textContent = `weather${place ? ` in ${place}` : ""}: ${temp(wx.data.t)}, ${WX_CODES[wx.data.code] || ""}`;
    } catch (e) {
      wx.state = wx.data ? "ok" : framed ? "hidden" : "off";
    }
    persist(); renderWx();
    if (!(snd.for && !audio.paused)) setFx(fxFor(birdAt(state.view)));
  }
  $("#wx").addEventListener("click", () => loadWeather(true));
  setInterval(() => { if (!document.hidden && wx.data && Date.now() - wx.data.at > 15 * 6e4) loadWeather(false); }, 6e4);

  /* ---------- boot ---------- */
  renderUnit();
  if (wx.data) { wx.state = "ok"; renderWx(); }
  if (!wx.asked || wx.data) loadWeather(false); else { wx.state = framed ? "hidden" : "off"; renderWx(); }
  markSeen();
  render(true);
  loop();
})();
</script>
</body>
